:PLANT_SEED_GENESIS: # ===================================
  :args:
    :locals:
      :kind: scope_declaration
      :args: {}
      :body:
      - :kind: parameter_declaration
        :args:
          :label: Plant
          :default_value:
            :kind: coordinate
            :args:
              :z: 0
              :y: 0
              :x: 0
  :color: yellow
  :name: Plant seed
  :body:
  - :kind: lua
    :args:
      :lua: |
        local function job(status, percent)
          set_job("Plant seed", {status = status, percent = percent})
        end

        local function fail(message)
          job("Failed", 0)
          if message then
            toast(message, "error")
          end
        end

        job("Checking prerequisites", 0)

        if not verify_tool{type = "seeder"} then
          fail()
          return
        end
        local seeder = get_mounted_tool()

        local plant = variable("Plant")
        local depth = plant.depth or 25

        -- Check vacuum state
        local vacuum_pump_pin = 9
        if read_pin(vacuum_pump_pin) ~= 1 then
          fail("Vacuum must be on to carry seed.")
          return
        end

        -- Calculate tool-compensated destinations
        local soil_z = soil_height(plant.x, plant.y)
        local approach = resolve_tool_move{
          id = seeder.id,
          x = plant.x,
          y = plant.y,
          z = soil_z + 150,
          safe_z = true
        }
        local insertion = resolve_tool_move{
          id = seeder.id,
          z = soil_z - depth,
          speed = 25
        }
        for _, target in ipairs({approach, insertion}) do
          if not verify_in_bounds(target) then
            fail()
            return
          end
        end

        -- Move to above plant
        job("Moving to plant", 25)
        move(approach)

        -- Plant seed
        job("Planting seed", 50)
        move(insertion)

        -- Turn off vacuum pump
        off(vacuum_pump_pin)

        -- Retract needle
        job("Retracting needle", 75)
        move{z = approach.z, speed = 25}

        -- Find Z home
        job("Finding Z home", 90)
        find_home("z")
        job("Complete", 100)

