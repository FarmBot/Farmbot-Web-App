  :args:
    :locals:
      :kind: scope_declaration
      :args: {}
      :body:
      - :kind: parameter_declaration
        :args:
          :label: Seed Tray
          :default_value:
            :kind: location_placeholder
            :args: {}
      - :kind: parameter_declaration
        :args:
          :label: Seed Tray Cell
          :default_value:
            :kind: text
            :args:
              :string: B3
      - :kind: parameter_declaration
        :args:
          :label: Cell Depth
          :default_value:
            :kind: numeric
            :args:
              :number: 5
  :color: yellow
  :name: Pick from Seed Tray
  :body:
  - :kind: lua
    :args:
      :lua: |
        local function job(status, percent)
          set_job("Pick from Seed Tray", {status = status, percent = percent})
        end

        local function fail(message)
          job("Failed", 0)
          if message then
            toast(message, "error")
          end
        end

        job("Checking prerequisites", 0)

        if not verify_tool{type = "seeder"} then
          fail()
          return
        end
        local seeder = get_mounted_tool()

        local container = variable("Seed Tray")
        local depth = variable("Cell Depth")
        local cell_label = variable("Seed Tray Cell")
        local location = get_seed_tray_cell(container, cell_label)
        if not location then
          fail()
          return
        end
        toast("Picking up seed from cell " .. cell_label)

        -- Calculate tool-compensated destinations
        local approach = resolve_tool_move{
          id = seeder.id,
          x = location.x,
          y = location.y,
          z = location.z + 25,
          grouping = "xy,z",
          route = "high"
        }
        local insertion = resolve_tool_move{
          id = seeder.id,
          z = location.z - depth,
          speed = 50
        }
        for _, target in ipairs({approach, insertion}) do
          if not verify_in_bounds(target) then
            fail()
            return
          end
        end

        -- Move above seed tray
        job("Moving to seed tray", 25)
        move(approach)

        -- Turn on vacuum pump and pick up seed
        job("Picking up seed", 75)
        local vacuum_pump_pin = 9
        on(vacuum_pump_pin)
        move(insertion)

        -- Retract needle
        job("Retracting needle", 90)
        move{z = approach.z, speed = 50}
        job("Complete", 100)

