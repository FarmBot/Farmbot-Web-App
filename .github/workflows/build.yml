name: Test and Render

on:
  push:
  pull_request:

permissions:
  contents: write

env:
  NOTIFY: ${{ github.ref_name == 'staging' }}
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 100

      - name: Send notification
        if: env.NOTIFY == 'true'
        run: scripts/send-notification "CI run started"

      - name: Send notification
        if: env.NOTIFY == 'true'
        run: scripts/send-notification "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|logs>"

      - name: Create compare link
        if: env.NOTIFY == 'true'
        run: |
          DEPLOYS_URL_API="https://api.github.com/repos/Farmbot/Farmbot-Web-App/deployments"
          COMPARE_URL_WEB="https://github.com/Farmbot/Farmbot-Web-App/compare/"
          data=$(curl -fsS "$DEPLOYS_URL_API") || data="[]"
          last_sha=$(printf "%s" "$data" | python3 -c 'import json,sys; data=json.loads(sys.stdin.read() or "[]"); deploy_index=0; sha=(data[deploy_index] or {}).get("sha"); print(sha or "")')
          compare_url="$COMPARE_URL_WEB$last_sha...${GITHUB_SHA}"
          echo "$compare_url"
          echo "COMPARE_URL=$compare_url" >> "$GITHUB_ENV"

      - name: Send notification
        if: env.NOTIFY == 'true'
        run: scripts/send-notification "<${COMPARE_URL}|diff>"

      - name: Set up CI
        uses: ./.github/actions/setup-ci

      - name: Run Ruby linters
        run: sudo docker compose run --rm web bun run ruby-check

      - name: Run Ruby tests
        run: sudo docker compose run --rm web bundle exec rspec spec --format progress --format RspecJunitFormatter --out test-results/rspec.xml

      - name: Check app coverage status
        if: always()
        run: sudo docker compose run --rm web bundle exec rake check_file_coverage:api || [ "$NOTIFY" = "true" ]

      - name: Upload app coverage to Codecov
        if: ${{ hashFiles('coverage_api/coverage.xml') != '' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage_api/coverage.xml
          fail_ci_if_error: false

      - name: Run JS linters
        run: sudo docker compose run --rm web bun run linters

      - name: Check bun build
        run: |
          sudo docker compose run --rm web bundle exec rake assets:precompile 2>&1 | tee assets_precompile.log
          printf -- '-%.0s' {1..50}; printf '\n'
          if grep -Ei '^(warn|error):' assets_precompile.log; then
            exit 1
          fi

      - name: Run JS tests
        run: |
          set +e
          sudo docker compose run -T --rm web bun test --reporter=junit --reporter-outfile=test-results/junit.xml > test-results/js-test-output.log 2>&1
          status=$?
          head -n 5 test-results/js-test-output.log
          tail -n 5 test-results/js-test-output.log
          if [ "$status" -eq 0 ]; then
            echo "COVERAGE_AVAILABLE=true" >> "$GITHUB_ENV"
          fi
          exit $status

      - name: Check frontend coverage status
        if: always()
        env:
          GITHUB_PULL_REQUEST: ${{ github.event.pull_request.html_url || '/0' }}
        run: sudo docker compose run --rm -e GITHUB_SHA="$GITHUB_SHA" -e GITHUB_REF_NAME="$GITHUB_REF_NAME" -e GITHUB_PULL_REQUEST="$GITHUB_PULL_REQUEST" web bundle exec rake coverage:run || [ "$NOTIFY" = "true" ]

      - name: Check frontend file coverage status
        if: always()
        run: |
          changed=$(git diff --name-only staging...HEAD | tr '\n' ',' | sed 's/,$//') || true
          sudo docker compose run --rm -e CHANGED_FILES="$changed" web bundle exec rake check_file_coverage:fe || true

      - name: Report frontend coverage to Coveralls
        if: env.COVERAGE_AVAILABLE == 'true'
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage_fe/lcov.info
          format: lcov
          fail-on-error: false

      - name: Restore frontend coverage value
        if: always()
        uses: actions/cache/restore@v5
        with:
          path: fe_coverage.csv
          key: fe-coverage-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            fe-coverage-${{ github.ref_name }}-

      - name: Track frontend coverage value
        if: always()
        run: |
          if [ "$COVERAGE_AVAILABLE" != "true" ]; then
            echo "skipping"
            exit 0
          fi
          eval "$(awk -F: '/^LH:/ { covered += $2 } /^LF:/ { total += $2 } END { printf "COVERED=%d\nTOTAL=%d\n", covered, total }' coverage_fe/lcov.info)"
          FE_VALUE=$(awk "BEGIN { printf \"%.2f\", ($COVERED / $TOTAL) * 100 }")
          if [ -f fe_coverage.csv ]; then
            PREV_FE=$(python3 -c 'import csv; f=open("fe_coverage.csv", newline=""); r=csv.reader(f); next(r, None); rows=[float(row[0]) for row in r if row and row[0]]; print(f"{rows[-1]:.2f}" if rows else "98.7")')
          else
            PREV_FE=98.7
          fi
          percent_change=$(FE_VALUE="$FE_VALUE" PREV_FE_VALUE="$PREV_FE" python3 -c 'import os; fe=float(os.environ.get("FE_VALUE","0") or 0); prev=float(os.environ.get("PREV_FE_VALUE","0") or 0); print("n/a" if prev==0 else f"{((fe-prev)/prev)*100:.2f}")')
          echo "Covered lines: $COVERED, Total lines: $TOTAL, Coverage: $FE_VALUE%"
          echo "$FE_VALUE% ($percent_change% change)"
          if [ ! -f fe_coverage.csv ]; then
            printf '%s\n' "percent,covered lines,total lines,percent change" > fe_coverage.csv
          fi
          printf '%s\n' "$FE_VALUE,$COVERED,$TOTAL,$percent_change" >> fe_coverage.csv
          cat fe_coverage.csv

      - name: Save frontend coverage value
        if: ${{ always() && hashFiles('fe_coverage.csv') != '' }}
        uses: actions/cache/save@v5
        with:
          path: fe_coverage.csv
          key: fe-coverage-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results
          if-no-files-found: warn

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            fe_coverage.csv
            scene_metrics.csv
          if-no-files-found: warn

      - name: On failure
        if: failure()
        run: |
          sudo docker compose ps || true
          sudo docker compose logs --no-color --tail=500 || true

      - name: Send notification
        if: success() && env.NOTIFY == 'true'
        run: scripts/send-notification "CI run succeeded"

      - name: Send notification
        if: failure() && env.NOTIFY == 'true'
        run: scripts/send-notification "CI run failed"

  render:
    runs-on: gpu

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up CI
        uses: ./.github/actions/setup-ci

      - name: Start services
        run: |
            sudo docker compose up -d
            sudo docker compose ps

      - name: Install playwright
        run: |
            curl -fsSL https://bun.sh/install | bash
            export BUN_INSTALL="$HOME/.bun"
            export PATH="$BUN_INSTALL/bin:$PATH"
            export PLAYWRIGHT_BROWSERS_PATH=/tmp/playwright-browsers
            echo "BUN_INSTALL=$BUN_INSTALL" >> "$GITHUB_ENV"
            echo "$BUN_INSTALL/bin" >> "$GITHUB_PATH"
            echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
            bunx playwright install chromium --with-deps

      - name: Set up GPU
        run: |
            sudo modprobe nvidia || true
            sudo modprobe nvidia_uvm || true
            ls -la /dev/nvidia* || true
            nvidia-smi

      - name: Wait for load
        run: |
          for i in $(seq 1 90); do
              if curl -fsS "http://127.0.0.1:3000/promo" >/dev/null; then
                echo "web is up"
                exit 0
              fi
              sleep 2
            done
          echo "web did not become ready"
          exit 1

      - name: Run playwright
        run: |
          attempts=2
            for _ in $(seq 1 "$attempts"); do
              url="http://localhost:3000/promo?sizePreset=Genesis+XL&promoSpread=true"
              echo "Attempting FPS check via ${url}"
              if ! sudo docker compose exec -T web curl -I "${url}" >/dev/null; then
                continue
              fi

              if ! fps_output=$(bun scripts/fps.js "${url}" "/tmp/promo.png" "/tmp/fps_plot.png"); then
                echo "${fps_output}"
                continue
              fi
              echo "${fps_output}"

              fps_value=$(echo "${fps_output}" | awk -F= '/^FPS_VALUE=/{print $2; exit}')
              scene_metrics=$(echo "${fps_output}" | awk -F= '/^SCENE_METRICS=/{print $2; exit}')
              webgl_status=$(echo "${fps_output}" | awk -F= '/^WEBGL_STATUS=/{print $2; exit}')
              webgl_vendor=$(echo "${fps_output}" | awk -F= '/^WEBGL_VENDOR=/{print $2; exit}')
              webgl_renderer=$(echo "${fps_output}" | awk -F= '/^WEBGL_RENDERER=/{print $2; exit}')
              echo "FPS_VALUE=${fps_value}" >> "$GITHUB_ENV"
              echo "SCENE_METRICS=${scene_metrics}" >> "$GITHUB_ENV"
              echo "WEBGL_STATUS=${webgl_status}" >> "$GITHUB_ENV"
              echo "WEBGL_VENDOR=${webgl_vendor}" >> "$GITHUB_ENV"
              echo "WEBGL_RENDERER=${webgl_renderer}" >> "$GITHUB_ENV"

              exit 0
            done
          echo "FPS check failed"
          exit 1

      - name: Restore FPS value
        uses: actions/cache/restore@v5
        with:
          path: |
            fps_value.txt
            scene_metrics.csv
          key: fps-value-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            fps-value-${{ github.ref_name }}-

      - name: Track FPS value
        run: |
          if [ -f fps_value.txt ]; then
            PREV=$(cat fps_value.txt)
          else
            PREV=60
          fi
          echo "Previous value: $PREV fps"
          percent_change=$(FPS_VALUE="$FPS_VALUE" PREV_VALUE="$PREV" python3 -c 'import os; fps=float(os.environ.get("FPS_VALUE","0") or 0); prev=float(os.environ.get("PREV_VALUE","0") or 0); print("n/a" if prev==0 else f"{((fps-prev)/prev)*100:.2f}")')
          echo "$FPS_VALUE fps ($percent_change% change)"
          echo "PERCENT_CHANGE=$percent_change" >> "$GITHUB_ENV"
          echo "$FPS_VALUE" > fps_value.txt
          if [ ! -f scene_metrics.csv ]; then
            printf '%s\n' "epoch, FPS, Calls, Triangles, Points, Lines, Geometries, Textures, Objects, Meshes, Instanced meshes" > scene_metrics.csv
          fi
          printf '%s\n' "$SCENE_METRICS" >> scene_metrics.csv
          cat scene_metrics.csv

      - name: Save FPS value
        if: ${{ hashFiles('fps_value.txt') != '' }}
        uses: actions/cache/save@v5
        with:
          path: |
            fps_value.txt
            scene_metrics.csv
          key: fps-value-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: View values
        run: |
          echo $FPS_VALUE
          echo $SCENE_METRICS
          echo $WEBGL_STATUS
          echo $WEBGL_VENDOR
          echo $WEBGL_RENDERER

      - name: Send notification
        if: env.NOTIFY == 'true'
        run: scripts/send-notification "${FPS_VALUE} fps (${PERCENT_CHANGE}% change)"

      - name: Upload image artifacts
        uses: actions/upload-artifact@v7
        with:
          name: images
          path: |
            /tmp/promo.png
            /tmp/fps_plot.png
          if-no-files-found: warn

      - name: On failure
        if: failure()
        run: |
          sudo docker compose ps || true
          sudo docker compose logs --no-color --tail=500 || true

      - name: Publish image links
        if: success() && env.NOTIFY == 'true'
        env:
          ARTIFACT_BRANCH: ci-artifacts
        run: |
          worktree=$(mktemp -d)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$ARTIFACT_BRANCH" >/dev/null; then
            git fetch origin "$ARTIFACT_BRANCH"
            git worktree add "$worktree" "origin/$ARTIFACT_BRANCH"
          else
            git worktree add --detach "$worktree"
            git -C "$worktree" switch --orphan "$ARTIFACT_BRANCH"
          fi

          mkdir -p "$worktree/build/latest" "$worktree/build/${GITHUB_RUN_ID}"
          cp /tmp/promo.png "$worktree/build/latest/promo.png"
          cp /tmp/fps_plot.png "$worktree/build/latest/fps_plot.png"
          cp /tmp/promo.png "$worktree/build/${GITHUB_RUN_ID}/promo.png"
          cp /tmp/fps_plot.png "$worktree/build/${GITHUB_RUN_ID}/fps_plot.png"
          git -C "$worktree" add build
          git -C "$worktree" commit -m "Update CI image artifacts for ${GITHUB_RUN_ID}" || true
          git -C "$worktree" push origin "HEAD:$ARTIFACT_BRANCH"

          raw_base="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${ARTIFACT_BRANCH}/build/${GITHUB_RUN_ID}"
          echo "SCREENSHOT_URL=${raw_base}/promo.png" >> "$GITHUB_ENV"
          echo "FPS_PLOT_URL=${raw_base}/fps_plot.png" >> "$GITHUB_ENV"

      - name: Send notification
        if: success() && env.NOTIFY == 'true'
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          for MESSAGE in \
            "<${SCREENSHOT_URL:-$RUN_URL}|screenshot>" \
            "<${FPS_PLOT_URL:-$RUN_URL}|fps>"
          do
            scripts/send-notification "$MESSAGE"
          done
